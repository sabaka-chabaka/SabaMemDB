name: SMDB-CI2

on:
  push:
    branches:
      - master

jobs:
  build-check-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

  run-tests-all:
    runs-on: ubuntu-latest

    needs: build-check-all

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6

      - run: dotnet restore

      - run: dotnet test --no-restore